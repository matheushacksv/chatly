server {
    listen 80;
    server_name api.chatly.ia.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.chatly.ia.br;

    ssl_certificate /etc/letsencrypt/live/api.chatly.ia.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.chatly.ia.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # WebSocket
    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }
}

server {
    listen 80;
    server_name app.chatly.ia.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name app.chatly.ia.br;

    ssl_certificate /etc/letsencrypt/live/api.chatly.ia.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.chatly.ia.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    root /var/www/chatlyai;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache assets com hash no nome
    location ~* \.(js|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
