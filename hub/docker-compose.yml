services:
  web:
    build: .
    env_file: .env
    depends_on: [redis, db]
    restart: unless-stopped
  worker:
    build: .
    command: celery -A core worker -l info --concurrency=4
    env_file: .env
    depends_on: [redis, db]
    restart: unless-stopped
  beat:
    build: .
    command: celery -A core beat -l info --scheduler django_celery_beat.schedules:DatabaseScheduler
    env_file: .env
    depends_on: [redis, db]
    restart: unless-stopped
  db:
    image: postgres:16
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
  redis:
    image: redis:7-alpine

volumes:
  postgres_data:

