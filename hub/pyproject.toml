[project]
name = "hub"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "agno[pgvector]>=2.5.14",
    "anthropic>=0.93.0",
    "boto3>=1.42.87",
    "celery>=5.6.3",
    "channels>=4.3.2",
    "channels-redis>=4.3.0",
    "daphne>=4.2.1",
    "ddgs>=9.13.1",
    "django>=6.0.4",
    "django-celery-results>=2.6.0",
    "django-cors-headers>=4.9.0",
    "django-encrypted-model-fields>=0.6.5",
    "django-ninja>=1.6.2",
    "django-ninja-jwt>=5.4.4",
    "django-storages>=1.14.6",
    "groq>=1.1.2",
    "httpx>=0.28.1",
    "openai>=2.31.0",
    "psycopg[binary]>=3.3.3",
    "psycopg2-binary>=2.9.11",
    "pydantic[email]>=2.12.5",
    "pypdf>=6.10.2",
    "python-decouple>=3.8",
    "redis>=7.4.0",
    "sentry-sdk[celery,django]>=2.58.0",
    "stripe>=15.1.0",
    "whitenoise>=6.12.0",
    "wikipedia>=1.4.0",
    "pgvector>=0.4.2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-django>=4.12.0",
    "pytest-mock>=3.15.1",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "core.settings_test"
python_files = ["test_*.py", "tests.py", "*_tests.py"]
addopts = "-q --reuse-db"
